name: CI

on:
  push:
  pull_request:

jobs:
  android:
    name: Android (assembleDebug + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run Android lint
        run: ./gradlew :app:lint --no-daemon

  functions:
    name: Cloud Functions (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

  rules-test:
    name: Firestore + Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # The Firestore/Storage emulators run on the JVM, and current firebase-tools
        # requires Java 21+ to run at all (older JDKs fail outright).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install test dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Run rules tests against the Firestore and Storage emulators
        # No live Firebase project needed - "demo-*" project IDs are handled
        # entirely by the emulators. Phase 3b adds storage-rules.test.ts, the
        # first suite that needs the Storage emulator alongside Firestore's.
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --project demo-agastyaone-rules-test \
            --only firestore,storage \
            "npm --prefix firestore-tests run test"

  razorpay-functions-test:
    name: Cloud Functions (Razorpay webhook + payment link tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # The Firestore emulator runs on the JVM, and current firebase-tools
        # requires Java 21+ to run at all.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            functions-tests/package-lock.json

      - name: Install Cloud Functions dependencies
        # functions-tests imports functions/src directly (see its test files) rather
        # than going through the Functions emulator, so functions/'s own
        # node_modules (firebase-admin etc.) must be present too.
        working-directory: functions
        run: npm ci

      - name: Install test dependencies
        working-directory: functions-tests
        run: npm ci

      - name: Typecheck
        working-directory: functions-tests
        run: npm run typecheck

      - name: Run Razorpay Cloud Function tests against the Firestore emulator
        # Phase 4b - webhook signature verification, amount matching, idempotency,
        # and createPaymentLink's role/tenant authorization, all against real
        # Firestore emulator reads/writes. Only the Firestore emulator is needed -
        # the handlers are imported and called directly (see functions-tests/*.test.ts),
        # not invoked through the Functions/Auth emulators. Uses only a local
        # placeholder secret (functions/.secret.local is git-ignored, never a real key)
        # and a stubbed fetch for the one real Razorpay network call - never a live key.
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --project demo-agastyaone-rules-test \
            --only firestore \
            "npm --prefix functions-tests run test"
