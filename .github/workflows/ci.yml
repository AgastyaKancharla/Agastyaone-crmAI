name: CI

on:
  push:
  pull_request:

jobs:
  android:
    name: Android (assembleDebug + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run Android lint
        run: ./gradlew :app:lint --no-daemon

  functions:
    name: Cloud Functions (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

  rules-test:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # The Firestore emulator runs on the JVM, and current firebase-tools
        # requires Java 21+ to run at all (older JDKs fail outright).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install test dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Run rules tests against the Firestore emulator
        # No live Firebase project needed - "demo-*" project IDs are handled
        # entirely by the emulator.
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --project demo-agastyaone-rules-test \
            --only firestore \
            "npm --prefix firestore-tests run test"
